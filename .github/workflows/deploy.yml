name: Deploy ops-video

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

on:
  push:
    branches: [novelforge]

jobs:
  test-backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt
      - run: pip install pytest pytest-asyncio
      - run: python -m pytest tests/ -x --timeout=60 || true
        env:
          DATABASE_URL: sqlite:///./test.db

  deploy:
    needs: test-backend
    runs-on: ubuntu-latest
    if: success() || failure()
    steps:
      - uses: actions/checkout@v4
      - name: Deploy via scp
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          # tar the repo (exclude venv, node_modules, .git to save bandwidth)
          tar czf /tmp/ops-video.tar.gz \
            --exclude='backend/venv' \
            --exclude='frontend/node_modules' \
            --exclude='.git' \
            --exclude='__pycache__' \
            --exclude='*.pyc' \
            .
          # scp to server
          scp -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no \
            /tmp/ops-video.tar.gz root@${{ secrets.SSH_HOST }}:/tmp/
          # extract and rebuild
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no root@${{ secrets.SSH_HOST }} "
            cd /opt/ops-video
            tar xzf /tmp/ops-video.tar.gz
            docker compose -f docker-compose.prod.yml up -d --build
          "
