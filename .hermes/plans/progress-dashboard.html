<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>进度看板</title>
    <meta http-equiv="refresh" content="5">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'SF Mono', 'Fira Code', 'Courier New', monospace; background: #0d1117; color: #c9d1d9; padding: 20px; }
        .header { display: none; text-align: center; padding: 20px 0; border-bottom: 1px solid #30363d; margin-bottom: 20px; }
        .header h1 { color: #58a6ff; font-size: 24px; }
        .header p { color: #8b949e; margin-top: 8px; }
        .progress-bar { width: 100%; height: 24px; background: #21262d; border-radius: 12px; margin: 16px 0; overflow: hidden; }
        .progress-fill { height: 100%; background: linear-gradient(90deg, #238636, #2ea043); transition: width 0.5s; border-radius: 12px; }
        .stats { display: flex; gap: 20px; justify-content: center; margin: 16px 0; flex-wrap: wrap; }
        .stat { text-align: center; padding: 12px 24px; background: #161b22; border-radius: 8px; border: 1px solid #30363d; min-width: 100px; }
        .stat-value { font-size: 28px; font-weight: bold; }
        .stat-label { font-size: 12px; color: #8b949e; margin-top: 4px; }
        .stat.pending .stat-value { color: #d29922; }
        .stat.running .stat-value { color: #58a6ff; animation: pulse 1.5s infinite; }
        .stat.completed .stat-value { color: #3fb950; }
        .stat.failed .stat-value { color: #f85149; }
        @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.6; } }
        .phases { display: grid; gap: 12px; max-width: 1200px; margin: 0 auto; }
        .phase { background: #161b22; border: 1px solid #30363d; border-radius: 8px; overflow: hidden; }
        .phase-header { padding: 12px 16px; display: flex; justify-content: space-between; align-items: center; }
        .phase-name { font-weight: bold; }
        .phase-status { padding: 4px 12px; border-radius: 12px; font-size: 12px; }
        .status-pending { background: #d2992220; color: #d29922; }
        .status-running { background: #58a6ff20; color: #58a6ff; }
        .status-completed { background: #3fb95020; color: #3fb950; }
        .status-failed { background: #f8514920; color: #f85149; }
        .status-partial { background: #a371f720; color: #a371f7; }
        .tasks { padding: 0 16px 12px; }
        .task { padding: 8px 12px; margin: 4px 0; border-radius: 4px; display: flex; justify-content: space-between; align-items: center; font-size: 13px; }
        .task:hover { background: #1c2128; }
        .task-status { width: 10px; height: 10px; border-radius: 50%; margin-right: 8px; display: inline-block; }
        .task-pending .task-status { background: #484f58; }
        .task-running .task-status { background: #58a6ff; animation: pulse 1.5s infinite; }
        .task-completed .task-status { background: #3fb950; }
        .task-failed .task-status { background: #f85149; }
        .agent-badge { font-size: 10px; padding: 2px 8px; background: #30363d; border-radius: 4px; color: #8b949e; }
        .last-updated { text-align: center; color: #484f58; font-size: 12px; margin-top: 20px; }
        .dep { font-size: 11px; color: #484f58; margin-left: 8px; }
        .error-msg { text-align: center; color: #f85149; font-size: 14px; margin: 20px 0; display: none; }
    </style>
</head>
<body>
    <div class="header">
        <h1>Ops-Video 短剧架构重构</h1>
        <p>Phase 15-16 实现计划进度</p>
    </div>

    <div class="progress-bar"><div class="progress-fill" id="totalProgress" style="width: 0%"></div></div>
    <p id="progressText" style="text-align: center; color: #8b949e; font-size: 14px;">加载中...</p>
    <p class="error-msg" id="errorMsg">无法加载进度数据，请确保通过 HTTP 服务器访问此页面</p>

    <div class="stats">
        <div class="stat pending"><div class="stat-value" id="pendingCount">-</div><div class="stat-label">待处理</div></div>
        <div class="stat running"><div class="stat-value" id="runningCount">-</div><div class="stat-label">执行中</div></div>
        <div class="stat completed"><div class="stat-value" id="completedCount">-</div><div class="stat-label">已完成</div></div>
        <div class="stat failed"><div class="stat-value" id="failedCount">-</div><div class="stat-label">失败</div></div>
    </div>

    <div class="phases" id="phases"></div>

    <p class="last-updated" id="lastUpdated">最后更新：--</p>

    <script>
        const statusEmoji = { pending: '⏳', running: '🔄', completed: '✅', failed: '❌' };
        const statusLabel = { pending: '等待中', running: '进行中', completed: '完成', failed: '失败' };

        function render(data) {
            let total = 0, completed = 0, running = 0, failed = 0;
            const phasesEl = document.getElementById('phases');
            phasesEl.innerHTML = '';

            data.phases.forEach(phase => {
                let pDone = 0, pRun = 0;
                phase.tasks.forEach(t => {
                    total++;
                    if (t.status === 'completed') { completed++; pDone++; }
                    if (t.status === 'running') { running++; pRun++; }
                    if (t.status === 'failed') failed++;
                });

                const pStatus = pDone === phase.tasks.length ? 'completed' :
                               pRun > 0 ? 'running' :
                               pDone > 0 ? 'partial' : 'pending';

                const phaseEl = document.createElement('div');
                phaseEl.className = 'phase';
                phaseEl.innerHTML = `
                    <div class="phase-header">
                        <span class="phase-name">${phase.name}</span>
                        <span class="phase-status status-${pStatus}">
                            ${statusLabel[pStatus] || pStatus} (${pDone}/${phase.tasks.length})
                        </span>
                    </div>
                    <div class="tasks">
                        ${phase.tasks.map(t => `
                            <div class="task task-${t.status}">
                                <span>
                                    <span class="task-status"></span>
                                    ${t.name}
                                    <span class="dep">[${t.id}]</span>
                                </span>
                                ${t.agent ? `<span class="agent-badge">🤖 ${t.agent}</span>` : ''}
                            </div>
                        `).join('')}
                    </div>
                `;
                phasesEl.appendChild(phaseEl);
            });

            document.getElementById('totalProgress').style.width = `${(total > 0 ? completed / total * 100 : 0)}%`;
            document.getElementById('progressText').textContent = `${completed} / ${total} 任务完成 (${total > 0 ? Math.round(completed / total * 100) : 0}%)`;
            document.getElementById('pendingCount').textContent = total - completed - running - failed;
            document.getElementById('runningCount').textContent = running;
            document.getElementById('completedCount').textContent = completed;
            document.getElementById('failedCount').textContent = failed;
            document.getElementById('lastUpdated').textContent = `最后更新：${data.last_updated || new Date().toLocaleString('zh-CN')}`;
            document.getElementById('errorMsg').style.display = 'none';
        }

        async function loadProgress() {
            try {
                const resp = await fetch('progress.json?t=' + Date.now());
                if (!resp.ok) throw new Error(`HTTP ${resp.status}`);
                const data = await resp.json();
                render(data);
            } catch (e) {
                document.getElementById('errorMsg').style.display = 'block';
                document.getElementById('errorMsg').textContent = `加载失败: ${e.message} — 请通过 HTTP 服务器访问（如 python3 -m http.server）`;
            }
        }

        loadProgress();
        setInterval(loadProgress, 3000);
    </script>
</body>
</html>
